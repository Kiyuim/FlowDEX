Name: trade.rpc
ListenOn: 0.0.0.0:8081
Timeout: 30000  # 30 seconds timeout for RPC requests

# Etcd:
#   Hosts:
#   - 127.0.0.1:2379
#   Key: trade.rpc

simulate_only: false

Sol:
  ChainId: 100000
  #jito 不为空，就用jito地址来发送 (disabled for devnet)
  Jito: ""
  NodeUrl:
    # Fallback/default only. In production set the SOL_NODE_URL env var (a Railway
    # secret) to your Helius endpoint — it OVERRIDES this list and keeps the API
    # key out of git. Comma-separated; the first URL is primary (used by tx-build).
    # NOTE: public devnet aggressively rate-limits datacenter IPs (this is why
    # buys were failing on Railway), so a Helius URL via SOL_NODE_URL is required
    # in production, e.g.:
    #   SOL_NODE_URL=https://devnet.helius-rpc.com/?api-key=YOUR_KEY
    - "https://api.devnet.solana.com"
  Enable: true
  UUID: "e322635ed37c12a203af5f1e845278f26c2d46ca"

market_service:
  target: market.railway.internal:8080  # separate Railway service (private domain)
  nonblock: true
  timeout: 100000  # 3 seconds timeout
  transport: tcp


