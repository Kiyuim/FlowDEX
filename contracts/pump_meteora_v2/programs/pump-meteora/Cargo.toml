[package]
name = "pump-meteora"
version = "0.2.0"
description = "pump-meteora — security-hardened (optimized) build"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pump_meteora"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata"] }
solana-program = "1.18.18"
spl-token = "=4.0.3"
