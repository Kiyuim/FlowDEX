# Plain HTTP only serves ACME challenges (tls.sh) and redirects to HTTPS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# certs/ is filled by tls.sh (Let's Encrypt; a self-signed placeholder until
# the first issuance so nginx can always start).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    # The frontend calls the API two ways (both are in the source):
    #   fetch('/v1/...')            — TokenSource, TokenDetail, lib/trade.js
    #   fetch('/direct-api/v1/...') — TokenList, BuyModal, TradingViewChart, ...
    # Both must reach the gateway.
    location /v1/ {
        proxy_pass http://gateway:8083;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Strip the /direct-api prefix before forwarding.
    location /direct-api/ {
        proxy_pass http://gateway:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # /ws/tokens and /ws/kline, served by the websocket service.
    location /ws/ {
        proxy_pass http://websocket:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # WS connections are long-lived; don't let nginx cut them at 60s.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # SPA fallback — react-router owns /token/:mint, /source, /create, ...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
